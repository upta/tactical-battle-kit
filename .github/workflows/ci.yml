name: CI

# Compile and the headless balance suites on PRs and pushes to main.
# The in-engine scenario suite is NOT run here: scenario runs need a windowed
# engine, so it stays local (./validate.ps1) and is the Definition of Done's
# other gate. The sim suites need no window, which is why they can be the
# floor.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compile:
    name: Scripts compile
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        run: godot --headless --import --path src > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Load every script and scene (headless runtime pass)
        # Mirrors src/tools/check_scripts.ps1: three gates, because silence
        # used to read as success. Each gate records into $fail rather than
        # exiting, since `!` and `||` are exempt from `set -e`.
        run: |
          set +e
          godot --headless --path src --script res://tools/compile_check.gd > /tmp/compile.log 2>&1
          status=$?
          set -e
          cat /tmp/compile.log

          fail=0
          grep -q '^COMPILE CHECK COMPLETE: [1-9]' /tmp/compile.log ||
            { echo "No completion marker, or the walk reached no scripts."; fail=1; }
          # "resources still in use at exit" is Godot's exit-time leak report on Linux
          # after the walk has already finished and printed its marker; it is not a
          # compile failure (CLAUDE.md § Known issues).
          if grep -hE '^(USER |SCRIPT )?ERROR:|^COMPILE FAIL:' /tmp/compile.log | grep -v 'resources still in use at exit'; then fail=1; fi
          [ "$status" -eq 0 ] || { echo "Compile pass exited $status."; fail=1; }
          exit $fail

  simulate:
    name: Balance suites
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        run: godot --headless --import --path src > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Run every suite
        # Mirrors simulate.ps1: the RESULT line is the verdict; a missing
        # RESULT line or an ERROR line in the log fails the suite.
        run: |
          fail=0
          for suite in src/sim/suites/*.json; do
            name=$(basename "$suite" .json)
            echo "=== $name"
            godot --headless --path src --script res://addons/tactical_battle_kit/sim/sim_cli.gd -- --suite "res://sim/suites/$name.json" > "/tmp/sim_$name.log" 2>&1
            grep -E '^(RESULT|ARTIFACTS|FAILED) ' "/tmp/sim_$name.log" || true
            if grep -qE '^(USER |SCRIPT )?ERROR:' "/tmp/sim_$name.log"; then
              grep -E '^(USER |SCRIPT )?ERROR:' "/tmp/sim_$name.log" | head -5
              fail=1
            fi
            code=$(grep -E '^RESULT ' "/tmp/sim_$name.log" | tail -1 | sed -E 's/.*"exit_code":([0-9]+).*/\1/')
            if [ -z "$code" ] || [ "$code" != "0" ]; then fail=1; fi
          done
          exit $fail

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: src/artifacts/sim/**/report.md
          if-no-files-found: ignore


  example-game:
    name: Example game suites
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        # A fresh project has no class cache; without this every kit
        # class_name is undeclared and the CLI fails to parse.
        run: godot --headless --import --path example-game > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Run every suite from the consuming project
        # The same loop as the kit's own job, run from a project that links
        # the addon the way a game does. A kit change that breaks class
        # registration or res:// resolution from a foreign root fails here.
        run: |
          fail=0
          for suite in example-game/sim/suites/*.json; do
            name=$(basename "$suite" .json)
            echo "=== $name"
            godot --headless --path example-game --script res://addons/tactical_battle_kit/sim/sim_cli.gd -- --suite "res://sim/suites/$name.json" > "/tmp/eg_$name.log" 2>&1
            grep -E '^(RESULT|ARTIFACTS|FAILED) ' "/tmp/eg_$name.log" || true
            if grep -qE '^(USER |SCRIPT )?ERROR:' "/tmp/eg_$name.log"; then
              grep -E '^(USER |SCRIPT )?ERROR:' "/tmp/eg_$name.log" | head -5
              fail=1
            fi
            code=$(grep -E '^RESULT ' "/tmp/eg_$name.log" | tail -1 | sed -E 's/.*"exit_code":([0-9]+).*/\1/')
            if [ -z "$code" ] || [ "$code" != "0" ]; then fail=1; fi
          done
          exit $fail

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-game-reports
          path: example-game/artifacts/sim/**/report.md
          if-no-files-found: ignore
