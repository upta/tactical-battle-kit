name: CI

# Compile and the headless balance suites on PRs and pushes to main.
# The in-engine scenario suite is NOT run here: scenario runs need a windowed
# engine, so it stays local (./validate.ps1) and is the Definition of Done's
# other gate. The sim suites need no window, which is why they can be the
# floor.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  compile:
    name: Scripts compile
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        run: godot --headless --import --path src > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Load every script and scene (headless runtime pass)
        # Mirrors src/tools/check_scripts.ps1: three gates, because silence
        # used to read as success. Each gate records into $fail rather than
        # exiting, since `!` and `||` are exempt from `set -e`.
        run: |
          set +e
          godot --headless --path src --script res://tools/compile_check.gd > /tmp/compile.log 2>&1
          status=$?
          set -e
          cat /tmp/compile.log

          fail=0
          grep -q '^COMPILE CHECK COMPLETE: [1-9]' /tmp/compile.log ||
            { echo "No completion marker, or the walk reached no scripts."; fail=1; }
          # "resources still in use at exit" is Godot's exit-time leak report on Linux
          # after the walk has already finished and printed its marker; it is not a
          # compile failure (CLAUDE.md § Known issues).
          if grep -hE '^(USER |SCRIPT )?ERROR:|^COMPILE FAIL:' /tmp/compile.log | grep -v 'resources still in use at exit'; then fail=1; fi
          [ "$status" -eq 0 ] || { echo "Compile pass exited $status."; fail=1; }
          exit $fail

  simulate:
    name: Balance suites
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        run: godot --headless --import --path src > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Run every suite
        # One command, same as simulate.ps1: the SUMMARY line is the verdict
        # (D11); a missing SUMMARY line or an ERROR line in the log fails.
        run: |
          godot --headless --path src --script res://addons/tactical_battle_kit/sim/sim_cli.gd -- --suites res://sim/suites > /tmp/sim.log 2>&1 || true
          grep -E '^(RESULT|ARTIFACTS|FAILED|SUMMARY) ' /tmp/sim.log || true
          fail=0
          if grep -qE '^(USER |SCRIPT )?ERROR:' /tmp/sim.log; then
            grep -E '^(USER |SCRIPT )?ERROR:' /tmp/sim.log | head -5
            fail=1
          fi
          code=$(grep -E '^SUMMARY ' /tmp/sim.log | tail -1 | sed -E 's/.*"exit_code":([0-9]+).*/\1/')
          if [ -z "$code" ] || [ "$code" != "0" ]; then fail=1; fi
          exit $fail

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: src/artifacts/sim/**/report.md
          if-no-files-found: ignore


  example-game:
    name: Example game suites
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Recreate symlinks
        run: bash setup.sh

      - name: Import assets
        # A fresh project has no class cache; without this every kit
        # class_name is undeclared and the CLI fails to parse.
        run: godot --headless --import --path example-game > /tmp/import.log 2>&1 || (cat /tmp/import.log && exit 1)

      - name: Run every suite from the consuming project
        # The command a game's own CI runs, from a project that links the
        # addon the way a game does. A kit change that breaks class
        # registration or res:// resolution from a foreign root fails here.
        run: |
          godot --headless --path example-game --script res://addons/tactical_battle_kit/sim/sim_cli.gd -- --suites res://sim/suites > /tmp/eg.log 2>&1 || true
          grep -E '^(RESULT|ARTIFACTS|FAILED|SUMMARY) ' /tmp/eg.log || true
          fail=0
          if grep -qE '^(USER |SCRIPT )?ERROR:' /tmp/eg.log; then
            grep -E '^(USER |SCRIPT )?ERROR:' /tmp/eg.log | head -5
            fail=1
          fi
          code=$(grep -E '^SUMMARY ' /tmp/eg.log | tail -1 | sed -E 's/.*"exit_code":([0-9]+).*/\1/')
          if [ -z "$code" ] || [ "$code" != "0" ]; then fail=1; fi
          exit $fail

      - name: Prove the failure path
        # A throwaway suite that cannot pass, written and deleted here so
        # nothing failing is ever checked in (D17). The runner must report
        # exit 1 and name the suite; a runner that cannot fail proves nothing.
        run: |
          cat > example-game/sim/suites/zz_throwaway_must_fail.json <<'EOF'
          {"suite_id": "zz_throwaway_must_fail", "battle": "res://battles/outpost.json", "runs": 5, "seed": 1,
           "matchups": [{"id": "g", "ai": {"garrison": "garrison", "raiders": "random"}}],
           "assertions": [{"metric": "win_rate.garrison", "comparator": "eq", "expected": 0}]}
          EOF
          godot --headless --path example-game --script res://addons/tactical_battle_kit/sim/sim_cli.gd -- --suites res://sim/suites > /tmp/eg_fail.log 2>&1 || true
          rm example-game/sim/suites/zz_throwaway_must_fail.json
          grep -E '^(FAILED|SUMMARY) ' /tmp/eg_fail.log || true
          code=$(grep -E '^SUMMARY ' /tmp/eg_fail.log | tail -1 | sed -E 's/.*"exit_code":([0-9]+).*/\1/')
          [ "$code" = "1" ] || { echo "Expected SUMMARY exit 1, got '$code'."; exit 1; }
          grep -q '^FAILED win_rate.garrison g ' /tmp/eg_fail.log || { echo "No FAILED line for the throwaway suite."; exit 1; }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-game-reports
          path: example-game/artifacts/sim/**/report.md
          if-no-files-found: ignore
